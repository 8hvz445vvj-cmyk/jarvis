<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="JARVIS">

<title>JARVIS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", sans-serif;
}

body {
    color: white;
}

.app {
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    background: #000;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* ---------- HEADER ---------- */

.header {
    height: 80px;
    display: flex;
    align-items: center;
    padding: 15px 24px 0 24px;
}

.title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -1px;
}

.info-button {
    margin-left: auto;
    border: none;
    background: transparent;
    color: white;
    font-size: 25px;
    width: 45px;
    height: 45px;
}

/* ---------- JARVIS CORE ---------- */

.core-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 35px;
    height: 220px;
}

.core {
    position: relative;
    width: 150px;
    height: 150px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.core-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    transition: all 0.3s ease;
}

.core-glow {
    position: absolute;
    width: 145px;
    height: 145px;
    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(0, 120, 255, 0.45) 0%,
        rgba(0, 80, 255, 0.18) 35%,
        transparent 70%
    );

    transition: all 0.3s ease;
}

.core-icon {
    position: relative;
    font-size: 45px;
    z-index: 2;
}

/* Thinking animation */

.thinking .core-ring {
    border-color: #087cff;
    box-shadow:
        0 0 10px #087cff,
        0 0 30px rgba(0,120,255,0.5);
    animation: pulse 1.2s infinite;
}

.thinking .core-glow {
    transform: scale(1.25);
    opacity: 0.8;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

/* ---------- ANSWER ---------- */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    -webkit-overflow-scrolling: touch;
}

.message {
    font-size: 17px;
    line-height: 1.5;
    color: white;
}

.ready {
    color: rgba(255,255,255,0.45);
}

/* ---------- INPUT ---------- */

.bottom {
    padding: 10px 20px 20px 20px;
}

.input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
}

.input {
    flex: 1;
    min-height: 50px;
    max-height: 120px;

    border: none;
    outline: none;

    color: white;
    font-size: 16px;

    padding: 14px 16px;

    border-radius: 18px;

    background: rgba(255,255,255,0.10);
}

.input::placeholder {
    color: rgba(255,255,255,0.45);
}

.button {
    border: none;
    width: 45px;
    height: 45px;
    min-width: 45px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    font-size: 18px;
}

.send {
    background: #087cff;
}

.send:disabled {
    background: #555;
}

.mic {
    background: rgba(255,255,255,0.12);
}

.mic.active {
    background: #087cff;
    box-shadow: 0 0 15px rgba(0,120,255,0.6);
}

/* ---------- INFO ---------- */

.info-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.65);

    display: none;
    justify-content: center;
    align-items: center;

    padding: 25px;

    z-index: 100;
}

.info-overlay.show {
    display: flex;
}

.info-box {
    width: 100%;
    max-width: 360px;

    background: #151515;

    border-radius: 25px;

    padding: 30px;

    text-align: center;

    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.info-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.info-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 15px;
}

.info-text {
    color: rgba(255,255,255,0.7);
    line-height: 1.5;
}

.close {
    margin-top: 25px;

    width: 100%;
    height: 48px;

    border: none;
    border-radius: 15px;

    background: #087cff;
    color: white;

    font-size: 16px;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="title">
            JARVIS
        </div>

        <button
            class="info-button"
            onclick="openInfo()">
            ⓘ
        </button>

    </div>


    <!-- CORE -->

    <div class="core-container">

        <div
            class="core"
            id="core">

            <div class="core-ring"></div>

            <div class="core-glow"></div>

            <div
                class="core-icon"
                id="coreIcon">
                〰
            </div>

        </div>

    </div>


    <!-- ANSWER -->

    <div
        class="messages"
        id="messages">

        <div
            class="message ready"
            id="answer">
            JARVIS je připraven.
        </div>

    </div>


    <!-- INPUT -->

    <div class="bottom">

        <div class="input-row">

            <button
                class="button mic"
                id="micButton"
                onclick="toggleMicrophone()">
                🎙️
            </button>

            <textarea
                class="input"
                id="message"
                rows="1"
                placeholder="Napiš JARVISovi…">
            </textarea>

            <button
                class="button send"
                id="sendButton"
                onclick="sendMessage()">

                ↑

            </button>

        </div>

    </div>

</div>


<!-- INFO WINDOW -->

<div
    class="info-overlay"
    id="infoOverlay">

    <div class="info-box">

        <div class="info-icon">
            ⓘ
        </div>

        <div class="info-title">
            JARVIS
        </div>

        <div class="info-text">
            Osobní AI asistent běžící
            na tvém zařízení.
            <br><br>
            Mozek JARVISe později
            napojíme na lokální AI model.
        </div>

        <button
            class="close"
            onclick="closeInfo()">
            Hotovo
        </button>

    </div>

</div>


<script>

let isThinking = false;
let recognition = null;
let listening = false;


/* ---------- INFO ---------- */

function openInfo() {
    document
        .getElementById("infoOverlay")
        .classList.add("show");
}

function closeInfo() {
    document
        .getElementById("infoOverlay")
        .classList.remove("show");
}


/* ---------- THINKING ---------- */

function setThinking(value) {

    isThinking = value;

    const core =
        document.getElementById("core");

    const icon =
        document.getElementById("coreIcon");

    if (value) {

        core.classList.add("thinking");

        icon.textContent = "🧠";

    } else {

        core.classList.remove("thinking");

        icon.textContent = "〰";

    }
}


/* ---------- MESSAGE ---------- */

async function sendMessage() {

    const input =
        document.getElementById("message");

    const answer =
        document.getElementById("answer");

    const text =
        input.value.trim();

    if (!text || isThinking)
        return;

    input.value = "";

    setThinking(true);

    answer.classList.remove("ready");

    answer.textContent =
        "JARVIS přemýšlí…";


    /*
       ZATÍM TESTOVACÍ ODPOVĚĎ.

       TADY POZDĚJI NAPOJÍME
       POCKETPAL / LOKÁLNÍ AI.
    */

    await wait(800);

    answer.textContent =
        "Rozumím. Jsem připraven připojit svůj AI mozek.";

    setThinking(false);
}


/* ---------- MICROPHONE ---------- */

function setupSpeechRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        console.log(
            "Rozpoznávání řeči není v tomto prohlížeči dostupné."
        );

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang = "cs-CZ";

    recognition.continuous = false;

    recognition.interimResults = true;


    recognition.onstart = function() {

        listening = true;

        document
            .getElementById("micButton")
            .classList.add("active");
    };


    recognition.onend = function() {

        listening = false;

        document
            .getElementById("micButton")
            .classList.remove("active");
    };


    recognition.onresult =
        function(event) {

            let finalText = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                finalText +=
                    event.results[i][0].transcript;
            }

            document
                .getElementById("message")
                .value = finalText;

            /*
               Jakmile máme finální větu,
               můžeme ji později automaticky
               poslat JARVISovi.
            */
        };


    recognition.onerror =
        function(event) {

            console.log(
                "Microphone error:",
                event.error
            );

            listening = false;

            document
                .getElementById("micButton")
                .classList.remove("active");
        };
}


function toggleMicrophone() {

    if (!recognition) {

        alert(
            "Rozpoznávání řeči není v tomto prohlížeči dostupné."
        );

        return;
    }

    if (listening) {

        recognition.stop();

    } else {

        recognition.start();

    }
}


/* ---------- HELPERS ---------- */

function wait(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}


/* ---------- START ---------- */

setupSpeechRecognition();


/* Enter = send */

document
    .getElementById("message")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );

</script>

</body>
</html>
